name = "crtlab-cron"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
no_bundle = true
[triggers]
crons = ["* * * * *"]

# 11-12: durable state for the sentinel baseline + watchdog alert dedupe (the Cache API is a silent no-op in cron triggers)
[[kv_namespaces]]
binding = "SENTINEL"
id = "468c0a0f89af438dab209a17780251b6"
