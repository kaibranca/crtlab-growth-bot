# ENGINE.md §8 — dependency security. Weekly, grouped, so it never floods the repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /reels
    schedule: { interval: weekly }
    groups: { reels: { patterns: ["*"] } }
