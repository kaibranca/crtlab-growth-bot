name: ai-eyes
on: { workflow_dispatch: }
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/ai-eyes.mjs
        env: { BING_API_KEY: "${{ secrets.BING_API_KEY }}", CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}", CF_ZONE_ID: "${{ secrets.CF_ZONE_ID }}" }
      - run: bash scripts/push.sh "ai eyes $(date -u +%FT%H)"
