name: promote-site
# DEPLOY WINDOWS (11-11, Railway budget): Railway deploys the site from branch `live`, not from every push. This fast-forwards
# live → rebuild-integration at the windows the cron worker starts (07:15 · 13:00 · 19:00 UTC) and on "deploy now". Nothing
# new = nothing happens (no deploy, no cost). Never force: live must be an ancestor of rebuild-integration.
on: { workflow_dispatch: {} }
concurrency: { group: promote-site, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: kaibranca/crtlab-standalone, ref: rebuild-integration, ssh-key: "${{ secrets.SITE_DEPLOY_KEY }}", fetch-depth: 0 }
      - name: Fast-forward live
        run: |
          # LOCK-IN (growth bot core.mjs): a wave of real people is on — the window holds, the site must not restart under it.
          # Kai's "deploy now" (push rebuild-integration:live directly) still works; the next window after the wave deploys.
          # 11-12: a lock-in holds ONE window at most. Deploys are zero-downtime (healthcheck + overlap, pages keep the last live
          # data version), and a good day kept lock-in on from 07:39 → every window held, nothing shipped, the cost machine starved.
          L=$(curl -fsS https://raw.githubusercontent.com/kaibranca/crtlab-growth-bot/main/data/machines/lockin.json || echo '{}')
          if echo "$L" | grep -q '"on": true'; then
            since=$(echo "$L" | python3 -c 'import json,sys,datetime as d;j=json.load(sys.stdin);print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(j["since"].replace("Z","+00:00"))).total_seconds()//3600))' 2>/dev/null || echo 0)
            if [ "${since:-0}" -lt 6 ]; then echo "lock-in on for ${since} h — this window held, the next one deploys"; exit 0; fi
            echo "lock-in on for ${since} h (≥ 6) — deploying anyway: zero-downtime, one window held is the limit"
          fi
          git fetch -q origin live
          head=$(git rev-parse HEAD); live=$(git rev-parse origin/live)
          if [ "$head" = "$live" ]; then echo "live is current ($(git rev-parse --short HEAD)) — no deploy"; exit 0; fi
          git merge-base --is-ancestor "$live" "$head" || { echo "::error::live is not behind rebuild-integration — refusing (no force)"; exit 1; }
          echo "promoting $(git log --oneline "$live..$head" | wc -l | tr -d ' ') commit(s):"; git log --oneline "$live..$head" | head -40
          git push origin "$head:refs/heads/live"
