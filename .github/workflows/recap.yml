name: recap
# 08:00 UTC Tue–Sat: the New York day that closed the evening before is complete in Databento by then (~5¢ a day)
on:
  schedule: [{ cron: "0 8 * * 2-6" }]
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/recap.mjs
        env: { DATABENTO_API_KEY: "${{ secrets.DATABENTO_API_KEY }}" }
      - run: node scripts/hubs.mjs
      - run: node scripts/react-pages.mjs
        continue-on-error: true
      - run: node scripts/upcoming.mjs
        continue-on-error: true
      - run: node scripts/summary.mjs
      - run: |
          bash scripts/push.sh "recap $(date -u +%F)"
