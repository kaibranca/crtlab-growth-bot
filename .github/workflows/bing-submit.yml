name: bing-submit
on: { workflow_dispatch: { inputs: { urls: { description: "extra paths, comma list", required: false } } } }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node scripts/bing-submit.mjs
        env: { BING_API_KEY: "${{ secrets.BING_API_KEY }}", URLS: "${{ inputs.urls }}" }
