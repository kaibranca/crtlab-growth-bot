name: weekly
on:
  # was schedule 0 5 * * 1: now started by the Cloudflare cron worker (cron-worker/worker.js). GitHub's own schedule drops runs and doubled them (11-09).
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: kaibranca/crtlab-standalone, ref: rebuild-integration, path: site, ssh-key: "${{ secrets.SITE_DEPLOY_KEY }}", sparse-checkout: lib }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Search Console → titles, gaps, outcomes
        run: node scripts/gsc.mjs
        env: { GSC_SA_JSON: "${{ secrets.GSC_SA_JSON }}" }
      - name: Bing Webmaster → Bing/ChatGPT pipeline, buyer-intent searches, titles, gaps
        run: node scripts/bing.mjs
        env: { BING_API_KEY: "${{ secrets.BING_API_KEY }}" }
        continue-on-error: true
      - name: Link check (every sitemap URL)
        run: node scripts/linkcheck.mjs
        timeout-minutes: 6
        continue-on-error: true
      - run: node scripts/summary.mjs
      - name: Publish title fixes to the site (deploys on Railway)
        run: |
          cd site
          git config user.name "crtlab-growth-bot"; git config user.email "bot@crtlab.pro"
          git add lib/seo-overrides.json
          git commit -qm "SEO: weekly Search Console + Bing title fixes (growth bot)" && git push -q || echo "no title changes"
      - name: Save bot data
        run: |
          bash scripts/push.sh "weekly $(date -u +%F)"
