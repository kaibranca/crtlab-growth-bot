name: daily
on:
  # was schedule 40 6 * * *: now started by the Cloudflare cron worker (cron-worker/worker.js). GitHub's own schedule drops runs and doubled them (11-09).
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/upcoming.mjs
        continue-on-error: true
      - run: node scripts/cal-history.mjs
        continue-on-error: true
      - run: node scripts/indexnow.mjs
      - name: Behaviour machine (learns from every click, per device + country)
        continue-on-error: true
        run: node scripts/behaviour.mjs
        env: { OPS_KEY: "${{ secrets.OPS_KEY }}", RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}", ALERT_TO: "${{ secrets.ALERT_TO }}" }
      - name: AI radar (what AI answers recommend; self-paced to $2.50/month)
        continue-on-error: true
        run: 'curl -s -o /dev/null -w "radar dispatch %{http_code}\n" -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/radar.yml/dispatches -d "{\"ref\":\"main\"}"'
      - name: Daily full device QA (all devices, light + dark)
        continue-on-error: true
        run: 'curl -s -o /dev/null -w "device-qa dispatch %{http_code}\n" -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/device-qa.yml/dispatches -d "{\"ref\":\"main\"}"'
      - name: Conversion leak machine (visit → account → first replay → paid, per source and page)
        continue-on-error: true
        run: node scripts/leak.mjs
        env: { OPS_KEY: "${{ secrets.OPS_KEY }}" }
      - name: Mentions machine (who sends people, who links, who talks about CRTLAB)
        continue-on-error: true
        run: npm i pg@8 --no-save --no-package-lock --silent && node scripts/mentions.mjs
        env: { ANALYTICS_DB_URL: "${{ secrets.ANALYTICS_DB_URL }}", BING_API_KEY: "${{ secrets.BING_API_KEY }}", OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}", RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}", ALERT_TO: "${{ secrets.ALERT_TO }}" }
      - run: node scripts/summary.mjs
      - run: |
          bash scripts/push.sh "daily $(date -u +%F)"
      - name: AI analyst (after this run's data is pushed, so it reads today's numbers)
        continue-on-error: true
        run: 'curl -s -o /dev/null -w "analyst dispatch %{http_code}\n" -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/analyst.yml/dispatches -d "{\"ref\":\"main\"}"'
