name: daily
on:
  schedule: [{ cron: "40 6 * * *" }]
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/indexnow.mjs
      - run: node scripts/summary.mjs
      - run: |
          git config user.name "crtlab-growth-bot"; git config user.email "bot@crtlab.pro"
          git add data; git commit -qm "daily $(date -u +%F)" || exit 0
          git pull -q --rebase && git push -q
