name: daily
on:
  schedule: [{ cron: "40 6 * * *" }]
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/upcoming.mjs
        continue-on-error: true
      - run: node scripts/cal-history.mjs
        continue-on-error: true
      - run: node scripts/indexnow.mjs
      - run: node scripts/summary.mjs
      - run: |
          bash scripts/push.sh "daily $(date -u +%F)"
