name: daily
on:
  # was schedule 40 6 * * *: now started by the Cloudflare cron worker (cron-worker/worker.js). GitHub's own schedule drops runs and doubled them (11-09).
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/upcoming.mjs
        continue-on-error: true
      - run: node scripts/cal-history.mjs
        continue-on-error: true
      - run: node scripts/indexnow.mjs
      # AI referral machine (11-10): clicks from the site, then learn → Bing submit (most valuable first) → plan + score
      - run: node scripts/ai-pull.mjs
        env: { OPS_KEY: "${{ secrets.OPS_KEY }}" }
        continue-on-error: true
      - run: node scripts/ai-machine.mjs
        env: { BING_API_KEY: "${{ secrets.BING_API_KEY }}" }
        continue-on-error: true
      - run: node scripts/summary.mjs
      - run: |
          bash scripts/push.sh "daily $(date -u +%F)"
