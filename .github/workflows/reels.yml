name: reels
# 2 reels a day from yesterday's recap: 12:30 UTC (London lunch, before the New York open) and 20:00 UTC (US afternoon, evening in UK/Africa)
# macOS runner so the text renders in the same system font as the approved reels. Without META_* secrets it's a dry run: the reel is an artifact only
on:
  schedule: [{ cron: "30 12 * * 2-6" }, { cron: "0 20 * * 2-6" }]
  workflow_dispatch:
    inputs:
      slot: { description: "1 or 2", default: "1" }
      date: { description: "recap date (blank = latest)", default: "" }
      post: { description: "post it (false = render only)", default: "true" }
concurrency: { group: reels, cancel-in-progress: false }
permissions: { contents: write, actions: read }
jobs:
  reel:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      META_TOKEN: ${{ secrets.META_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: slot
        run: |
          S="${{ github.event.inputs.slot }}"; [ -z "$S" ] && { [ "$(date -u +%H)" -lt 16 ] && S=1 || S=2; }
          echo "slot=$S" >> "$GITHUB_OUTPUT"
      - name: bars from the latest recap run
        run: |
          RUN=$(gh run list -w recap.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RUN" -n bars -D .cache
      - run: cd reels && npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: learn from the last reels
        if: steps.slot.outputs.slot == '1'
        run: node reels/daily/learn.mjs || true
      - name: pick the story
        run: node reels/daily/engine.mjs ${{ steps.slot.outputs.slot }} ${{ github.event.inputs.date }}
      - name: render
        run: node reels/daily/make.mjs reels/out/props.json reels/out/reel.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.slot.outputs.slot }}
          retention-days: 14
          path: |
            reels/out/reel.mp4
            reels/out/pick.json
      - name: post
        if: github.event.inputs.post != 'false'
        run: node reels/daily/post.mjs reels/out/reel.mp4 reels/out/pick.json ${{ steps.slot.outputs.slot }}
      - run: |
          git config user.name "crtlab-growth-bot"; git config user.email "bot@crtlab.pro"
          [ -d data/reels ] || exit 0; git add data/reels; git commit -qm "reel $(date -u +%F) slot ${{ steps.slot.outputs.slot }}" || exit 0
          git pull -q --rebase && git push -q
