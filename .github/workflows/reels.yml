name: reels
# DAILY 08:40 UTC (after the 08:00 recap): learn from the numbers → plan today's 2 reels → render → QA gate → artifact for the poster.
# macOS runner (free on public repos) so the type renders in the same system font as the approved reels. Nothing touches Railway.
on:
  # was schedule 40 8 * * *: now started by the Cloudflare cron worker (cron-worker/worker.js). GitHub's own schedule drops runs and doubled them (11-09).
  workflow_dispatch:
    inputs:
      date: { description: "plan date (blank = today UTC)", default: "" }
      force: { description: "re-plan even if a plan exists", default: "false" }
      rerender: { description: "re-render that date's existing reels (same props, current renderer)", default: "false" }
concurrency: { group: reels-make, cancel-in-progress: false }
permissions: { contents: write, actions: read }
jobs:
  make:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: 1-minute bars from the last 7 recaps (each recap saves ~2 days; merged = a full week of setups, no second data bill)
        run: |
          mkdir -p .cache
          for r in $(gh run list -w recap.yml -s success -L 10 --json databaseId -q '.[].databaseId'); do
            gh api repos/${{ github.repository }}/actions/runs/$r/artifacts -q '.artifacts[]|select(.name=="bars" and .expired==false)|.id' | grep -q . || continue
            gh run download "$r" -n bars -D ".cache/r$r" && mv .cache/r$r/*.json .cache/ 2>/dev/null; rm -rf ".cache/r$r"
          done
          ls .cache | wc -l
      - run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - run: cd reels && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund)
      - name: learn
        run: npm i pg@8 --no-save --no-package-lock --silent && node reels/engine/learn.mjs || true
        env: { ANALYTICS_DB_URL: "${{ secrets.ANALYTICS_DB_URL }}" }
      - name: weekly report (Sundays)
        if: github.event.schedule && (github.event_name == 'schedule')
        run: '[ "$(date -u +%u)" = "7" ] && node reels/engine/report.mjs || true'
      - name: plan
        run: FORCE=$([ "${{ github.event.inputs.force }}" = "true" ] && echo 1 || echo "") node reels/engine/plan.mjs ${{ github.event.inputs.date }}
      - name: music (Mixkit free license; fetched per run, never committed — public repo)
        continue-on-error: true
        run: |
          mkdir -p reels/music
          for id in 281 293 414 296 455 375 367 1102; do curl -sfL -A "Mozilla/5.0" -o reels/music/mixkit-$id.mp3 "https://assets.mixkit.co/music/$id/$id.mp3" || rm -f reels/music/mixkit-$id.mp3; done
          ls reels/music
      - name: render + QA
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(date -u +%F)
          # RE-RENDER (11-09): same reels, new renderer — pull the props from that date's newest render; the poster takes the newest artifact
          if [ "${{ github.event.inputs.rerender }}" = "true" ]; then
            ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=reels-$D" -q '[.artifacts[]|select(.expired==false)][0].id')
            [ -n "$ID" ] || { echo "no render to redo for $D"; exit 1; }
            mkdir -p reels/out && gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > rr.zip && unzip -oq rr.zip 'reel-*.json' -d reels/out && ls reels/out
          fi
          # render only if today's props exist (plan may have been made earlier); props are rebuilt from the plan file otherwise
          ls reels/out/reel-*.json >/dev/null 2>&1 || { echo "plan existed, nothing to render"; exit 0; }
          echo "D=$D" >> "$GITHUB_ENV"   # set first so a QA failure still uploads the videos to look at
          node reels/engine/make.mjs
      - uses: actions/upload-artifact@v7
        if: always() && env.D != ''
        with:
          name: reels-${{ env.D }}
          retention-days: 4
          path: |
            reels/out/reel-*.mp4
            reels/out/reel-*.json
            reels/out/qa.json
      - name: alert on failure
        if: failure()
        env: { RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
        run: |
          node -e 'import("./reels/engine/alert.mjs").then((m) => m.send([["render-" + new Date().toISOString().slice(0, 10), "Reel render or QA FAILED today, nothing will post. Run log: " + process.env.RUN_URL]]))'
      - run: bash scripts/push.sh "reels plan $(date -u +%F)"
        if: always()
