name: hourly
on:
  # was schedule 17 * * * *: now started by the Cloudflare cron worker (cron-worker/worker.js). GitHub's own schedule drops runs and doubled them (11-09).
  workflow_dispatch:
    inputs:
      spike: { description: "SENTINEL (cron worker): a people-fetch spike seen at the edge — JSON {why, pages}", required: false, default: "" }
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i pg@8 --no-save --no-package-lock --silent
      # CORE RUNTIME (11-14): every machine isolated, own timeout, ONLY its own secrets (scripts/steps.mjs), every result recorded
      # (data/guard/runs.jsonl + steps.json). Repeat failures email + turn this run red. Replaces continue-on-error / `|| true`.
      - name: Machines (hourly)
        id: run
        run: node scripts/run.mjs hourly
        env: { OPS_KEY: "${{ secrets.OPS_KEY }}", RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}", ALERT_TO: "${{ secrets.ALERT_TO }}", ANALYTICS_DB_URL: "${{ secrets.ANALYTICS_DB_URL }}", BING_API_KEY: "${{ secrets.BING_API_KEY }}", CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}", CF_ZONE_ID: "${{ secrets.CF_ZONE_ID }}", CF_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}", CF_BAN_LIST: "${{ secrets.CF_BAN_LIST }}", GH_WATCH_TOKEN: "${{ secrets.GH_WATCH_TOKEN }}", RAILWAY_API_TOKEN: "${{ secrets.RAILWAY_API_TOKEN }}", GH_TOKEN: "${{ github.token }}", SPIKE: "${{ inputs.spike }}" }
      - name: Save
        if: always()
        run: bash scripts/push.sh "hourly $(date -u +%FT%H:%M)"
      - name: Red if a machine keeps failing
        if: steps.run.outputs.failed != '0'
        run: echo "::error::${{ steps.run.outputs.failed }} machine(s) failing repeatedly — see the step table" && exit 1
