name: hourly
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: AI crawler counts
        run: node scripts/aicrawl.mjs
        env: { OPS_KEY: "${{ secrets.OPS_KEY }}" }
      - name: Watchdog
        id: wd
        continue-on-error: true
        run: node scripts/watchdog.mjs
      - run: node scripts/summary.mjs
      - name: Save
        run: |
          git config user.name "crtlab-growth-bot"; git config user.email "bot@crtlab.pro"
          git add data; git commit -qm "hourly $(date -u +%FT%H:%M)" || exit 0
          git pull -q --rebase && git push -q
      - name: Alert on failure
        if: steps.wd.outcome == 'failure'
        run: echo "::error::Watchdog failed — see the table above" && exit 1
