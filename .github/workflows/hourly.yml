name: hourly
on:
  # was schedule 17 * * * *: now started by the Cloudflare cron worker (cron-worker/worker.js). GitHub's own schedule drops runs and doubled them (11-09).
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: AI crawler counts
        run: node scripts/aicrawl.mjs
        env: { OPS_KEY: "${{ secrets.OPS_KEY }}" }
      # AI REFERRAL MACHINE (11-10) — the main short-term engine: learns every hour from the reads just drained + the
      # day's AI clicks, re-plans, and sends Bing the next most valuable pages (quota paced over the day)
      - name: AI referral machine
        continue-on-error: true
        run: node scripts/ai-pull.mjs && node scripts/ai-machine.mjs
        env: { OPS_KEY: "${{ secrets.OPS_KEY }}", BING_API_KEY: "${{ secrets.BING_API_KEY }}" }
      - name: Load alert (emails Kai if even one chart load was turned away, failed or slow in the last hour)
        continue-on-error: true
        run: node scripts/load-alert.mjs
        env: { OPS_KEY: "${{ secrets.OPS_KEY }}", RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}", ALERT_TO: "${{ secrets.ALERT_TO }}" }
      - name: Shield (ban repeat attackers 7 days at Cloudflare; Under Attack mode during a flood)
        continue-on-error: true
        run: node scripts/shield.mjs
        env: { CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}", CF_ZONE_ID: "${{ secrets.CF_ZONE_ID }}", CF_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}", CF_BAN_LIST: "${{ secrets.CF_BAN_LIST }}", OPS_KEY: "${{ secrets.OPS_KEY }}", RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}", ALERT_TO: "${{ secrets.ALERT_TO }}" }
      - name: Watchdog
        id: wd
        continue-on-error: true
        run: node scripts/watchdog.mjs
      - name: Calendar (actuals land within the hour)
        continue-on-error: true
        run: node scripts/upcoming.mjs
      - name: Indicator pages (every release since 2016; rewrites only indicators that just released)
        continue-on-error: true
        run: node scripts/indicators.mjs
      - name: Same-day news pages (actual vs forecast + Bitcoin/Ethereum, free; the rest fills in overnight)
        continue-on-error: true
        run: node scripts/live-news.mjs
      - name: Headlines
        continue-on-error: true
        run: node scripts/headlines.mjs
      - name: IndexNow (only URLs whose lastmod moved)
        continue-on-error: true
        run: node scripts/indexnow.mjs
      - run: node scripts/summary.mjs
      - name: Save
        run: |
          bash scripts/push.sh "hourly $(date -u +%FT%H:%M)"
      - name: Alert on failure
        if: steps.wd.outcome == 'failure'
        run: echo "::error::Watchdog failed — see the table above" && exit 1
